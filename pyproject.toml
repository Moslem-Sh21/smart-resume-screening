[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-resume-screening"
version = "0.0.1"
description = "Human-in-the-loop technical resume matching and candidate review platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Matthew Shokrolahi" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resume_screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"