name: Bug report
description: Report a reproducible problem in Visual Product RAG
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please provide enough information for the issue to be reproduced.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Clearly describe what went wrong.
      placeholder: Describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that consistently produce the problem.
      placeholder: |
        1. Start the application
        2. Upload an image
        3. Submit a query
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what actually happened.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and application version.
      placeholder: Windows 11, version 0.0.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant error messages or logs. Remove secrets first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed passwords, API keys, and other sensitive information.
          required: true